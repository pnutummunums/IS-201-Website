<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="https://pnutummunums.github.io/IS-201-Website/">
    <title>Chess Game</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/bootstrap-custom.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        .game-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .chessboard {
            width: 100%;
            aspect-ratio: 1 / 1;
            margin: 20px auto;
            border: 2px solid #333;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .controls {
            margin-top: 20px;
            text-align: center;
        }
        .back-link {
            margin-top: 30px;
            text-align: center;
        }
        .game-status {
            background-color: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="game-container">
            <div class="header">
                <h1>Chess Game</h1>
                <p>Play chess against the computer</p>
            </div>
            
            <div class="chessboard" id="chessboard">
                <!-- Chess board will be rendered here by JavaScript -->
            </div>
            
            <div class="controls">
                <button id="newGameBtn" class="btn btn-primary">New Game</button>
                <button id="undoBtn" class="btn btn-secondary">Undo Move</button>
            </div>
            
            <div class="game-status mt-3 text-center">
                <p id="status">Game ready. White to move.</p>
            </div>
            
            <div class="back-link">
                <a href="../chess.html" class="btn btn-outline-dark">Back to Chess Page</a>
            </div>
        </div>
    </div>

    <!-- JavaScript will be added in a separate file -->
    <script src="chess.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
